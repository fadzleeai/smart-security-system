# =========================================
# RPi-specific overrides (camera + GPIO)
# Usage: docker compose -f docker-compose.yml -f docker-compose.rpi.yml up security web
# =========================================

services:

  security:
    devices:
      - /dev/video0:/dev/video0
      - /dev/gpiomem:/dev/gpiomem
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
    group_add:
      - audio
    volumes:
      - /usr/lib/python3/dist-packages:/usr/lib/python3/dist-packages:ro
      - /usr/share/libcamera:/usr/share/libcamera:ro
      - /usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu:ro
      - /run/udev:/run/udev:ro
    environment:
      - PYTHONPATH=/usr/lib/python3/dist-packages

  web:
    devices:
      - /dev/video0:/dev/video0
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
    volumes:
      - /usr/lib/python3/dist-packages:/usr/lib/python3/dist-packages:ro
      - /usr/share/libcamera:/usr/share/libcamera:ro
      - /usr/lib/aarch64-linux-gnu:/usr/lib/aarch64-linux-gnu:ro
      - /run/udev:/run/udev:ro
    environment:
      - PYTHONPATH=/usr/lib/python3/dist-packages

  register:
    devices:
      - /dev/video0:/dev/video0
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
    volumes:
      - /run/udev:/run/udev:ro

  admin:
    devices:
      - /dev/video0:/dev/video0