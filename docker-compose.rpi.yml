# =========================================
# RPi-specific overrides (camera + GPIO)
# Usage: docker compose -f docker-compose.yml -f docker-compose.rpi.yml up security web
# =========================================

services:

  security:
    devices:
      - /dev/video0:/dev/video0
      - /dev/gpiomem:/dev/gpiomem
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
    group_add:
      - audio
    volumes:
      - /run/udev:/run/udev:ro

  web:
    volumes:
      - /run/udev:/run/udev:ro

  register:
    devices:
      - /dev/video0:/dev/video0
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
    volumes:
      - /run/udev:/run/udev:ro

  admin:
    devices:
      - /dev/video0:/dev/video0
      - /dev/gpiomem:/dev/gpiomem
    group_add:
      - audio