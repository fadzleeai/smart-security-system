# =========================================
# RPi-specific overrides (camera + GPIO)
# Usage: docker compose -f docker-compose.yml -f docker-compose.rpi.yml up security web
# =========================================

services:

  security:
    devices:
      - /dev/video0:/dev/video0
      - /dev/gpiomem:/dev/gpiomem
    group_add:
      - audio

  web:
    devices:
      - /dev/video0:/dev/video0

  register:
    devices:
      - /dev/video0:/dev/video0

  admin:
    devices:
      - /dev/video0:/dev/video0