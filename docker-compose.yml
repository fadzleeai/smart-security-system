version: "3.9"

services:

  # =========================================
  # MAIN SECURITY APP
  # =========================================
  security:
    build: .
    container_name: smart_security
    restart: unless-stopped
    privileged: true

    volumes:
      - ./known_faces:/app/known_faces
      - ./strangers:/app/strangers
      - ./logs:/app/logs
      - ./config.json:/app/config.json

    environment:
      - CONFIG_PATH=/app/config.json
      - KNOWN_FACES_DIR=/app/known_faces
      - STRANGERS_DIR=/app/strangers
      - DISPLAY=${DISPLAY:-}

    network_mode: host

  # =========================================
  # WEB APP
  # Usage: docker compose up web
  # Access: http://localhost:5000 or http://<rpi-ip>:5000
  # =========================================
  web:
    build: .
    container_name: smart_security_web
    restart: unless-stopped

    volumes:
      - ./known_faces:/app/known_faces
      - ./strangers:/app/strangers
      - ./logs:/app/logs
      - ./config.json:/app/config.json

    environment:
      - CONFIG_PATH=/app/config.json
      - KNOWN_FACES_DIR=/app/known_faces
      - STRANGERS_DIR=/app/strangers
      - LOG_FILE=/app/logs/security.log

    ports:
      - "5000:5000"

    command: python src/webapp.py

  # =========================================
  # REGISTER FACE (run on demand)
  # Usage: docker compose run register
  # =========================================
  register:
    build: .
    container_name: smart_security_register
    privileged: true
    stdin_open: true
    tty: true

    volumes:
      - ./known_faces:/app/known_faces
      - ./config.json:/app/config.json

    environment:
      - CONFIG_PATH=/app/config.json
      - KNOWN_FACES_DIR=/app/known_faces
      - DISPLAY=${DISPLAY:-}

    command: python src/register_face.py

  # =========================================
  # ADMIN PANEL (run on demand)
  # Usage: docker compose run admin
  # =========================================
  admin:
    build: .
    container_name: smart_security_admin
    stdin_open: true
    tty: true

    volumes:
      - ./known_faces:/app/known_faces
      - ./strangers:/app/strangers
      - ./logs:/app/logs
      - ./config.json:/app/config.json

    environment:
      - CONFIG_PATH=/app/config.json
      - KNOWN_FACES_DIR=/app/known_faces
      - STRANGERS_DIR=/app/strangers
      - DISPLAY=${DISPLAY:-}

    command: python admin.py